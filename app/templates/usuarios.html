{% extends "base.html" %}

{% block content %}

<link rel="stylesheet" href="/static/css/usuarios.css?v=2">

<div class="pageHeader" style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
    <div>
        <h1>👥 Gestión de Usuarios</h1>
        <p>Alta, baja, estado y acceso de usuarios del sistema.</p>
    </div>
    <div class="headerActions">
        <button class="primaryButton" onclick="abrirModalCrear()" style="background: #173D2D; display: inline-flex; align-items: center; gap: 6px; padding: 10px 16px; border-radius: 8px; font-weight: bold; border: none; color: white; cursor: pointer;">
            ➕ Crear Usuario
        </button>
    </div>
</div>

<div class="panel" style="background: white; border: 1px solid #edf2f7; border-radius: 12px; padding: 20px; box-shadow: 0 4px 6px rgba(0,0,0,0.01); overflow-x: auto;">
    <table id="tabla-usuarios" style="width: 100%; border-collapse: collapse; text-align: left; font-size: 0.92em; min-width: 600px;">
        <thead>
            <tr style="border-bottom: 2px solid #edf2f7; color: #4a5568; font-weight: bold;">
                <th style="padding: 12px 10px;">ID</th>
                <th style="padding: 12px 10px;">Nombre</th>
                <th style="padding: 12px 10px;">Usuario</th>
                <th style="padding: 12px 10px;">Contraseña</th>
                <th style="padding: 12px 10px;">Rol</th>
                <th style="padding: 12px 10px;">Estado</th>
                <th style="padding: 12px 10px; text-align: right;">Acciones</th>
            </tr>
        </thead>
        <tbody id="tbody-usuarios">
            <!-- Cargado dinámicamente -->
        </tbody>
    </table>
</div>

<!-- MODAL CREAR/EDITAR USUARIO -->
<div id="modal-usuario" class="modalOverlay" style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.4); z-index: 9999; justify-content: center; align-items: center; backdrop-filter: blur(4px);">
    <div class="modalContent" style="background: white; border-radius: 12px; width: 100%; max-width: 450px; box-shadow: 0 10px 25px rgba(0,0,0,0.15); display: flex; flex-direction: column; overflow: hidden;">
        <div class="modalHeader" style="background: #173D2D; color: white; padding: 16px 20px; display: flex; justify-content: space-between; align-items: center;">
            <h3 id="modal-titulo" style="margin: 0; font-size: 1.15em; font-weight: 700;">Crear Nuevo Usuario</h3>
            <button onclick="cerrarModal()" style="background: transparent; border: none; color: white; font-size: 1.5em; cursor: pointer; line-height: 1;">&times;</button>
        </div>
        <form id="form-usuario" onsubmit="guardarUsuarioForm(event)" style="margin: 0; display: flex; flex-direction: column; height: 100%;">
            <div class="modalBody" style="padding: 20px; display: flex; flex-direction: column; gap: 15px; background: #f7fafc; max-height: 60vh; overflow-y: auto;">
                <input type="hidden" id="form-fila-idx">
                
                <div style="display: flex; flex-direction: column; gap: 5px;">
                    <label style="font-weight: bold; font-size: 0.82em; color: #4a5568;">Seleccionar Formador/Empleado</label>
                    <select id="form-usuario-formador" onchange="actualizarCamposEmpleado(this.value)" style="padding: 8px 12px; border: 1px solid #cbd5e0; border-radius: 6px; background: white; color: #2d3748; outline: none; font-size: 0.9em;">
                        <option value="">-- Selecciona un formador... --</option>
                        <!-- Inyectado dinámicamente -->
                    </select>
                </div>
                
                <div style="display: flex; flex-direction: column; gap: 5px;">
                    <label style="font-weight: bold; font-size: 0.82em; color: #4a5568;">ID Empleado</label>
                    <input type="text" id="form-usuario-id" required style="padding: 8px 12px; border: 1px solid #cbd5e0; border-radius: 6px; background: #e2e8f0; color: #4a5568; outline: none; font-size: 0.9em;" readonly>
                </div>
                
                <div style="display: flex; flex-direction: column; gap: 5px;">
                    <label style="font-weight: bold; font-size: 0.82em; color: #4a5568;">Nombre Completo</label>
                    <input type="text" id="form-usuario-nombre" required style="padding: 8px 12px; border: 1px solid #cbd5e0; border-radius: 6px; background: #e2e8f0; color: #4a5568; outline: none; font-size: 0.9em;" readonly>
                </div>
                
                <div style="display: flex; flex-direction: column; gap: 5px;">
                    <label style="font-weight: bold; font-size: 0.82em; color: #4a5568;">Nombre de Usuario</label>
                    <input type="text" id="form-usuario-username" required placeholder="Ej: kiko.albert" style="padding: 8px 12px; border: 1px solid #cbd5e0; border-radius: 6px; background: white; color: #2d3748; outline: none; font-size: 0.9em;">
                </div>
                
                <div style="display: flex; flex-direction: column; gap: 5px;">
                    <label style="font-weight: bold; font-size: 0.82em; color: #4a5568;">Contraseña</label>
                    <input type="text" id="form-usuario-password" required placeholder="Contraseña de acceso" style="padding: 8px 12px; border: 1px solid #cbd5e0; border-radius: 6px; background: white; color: #2d3748; outline: none; font-size: 0.9em;">
                </div>
                
                <div style="display: flex; flex-direction: column; gap: 5px;">
                    <label style="font-weight: bold; font-size: 0.82em; color: #4a5568;">Rol de Usuario</label>
                    <select id="form-usuario-rol" required style="padding: 8px 12px; border: 1px solid #cbd5e0; border-radius: 6px; background: white; color: #2d3748; outline: none; font-size: 0.9em;">
                        <option value="Formador">Formador</option>
                        <option value="RRHH">RRHH</option>
                        <option value="Responsable">Responsable</option>
                        <option value="Administrador">Administrador</option>
                    </select>
                </div>
                
                <div style="display: flex; flex-direction: column; gap: 5px;">
                    <label style="font-weight: bold; font-size: 0.82em; color: #4a5568;">Estado</label>
                    <select id="form-usuario-activo" required style="padding: 8px 12px; border: 1px solid #cbd5e0; border-radius: 6px; background: white; color: #2d3748; outline: none; font-size: 0.9em;">
                        <option value="Sí">Activo (Sí)</option>
                        <option value="No">Inactivo (No)</option>
                    </select>
                </div>
            </div>
            
            <div class="modalFooter" style="padding: 15px 20px; background: white; border-top: 1px solid #edf2f7; display: flex; justify-content: flex-end; gap: 10px;">
                <button type="button" onclick="cerrarModal()" style="padding: 8px 16px; border: 1px solid #cbd5e0; border-radius: 6px; cursor: pointer; background: white; color: #4a5568; font-weight: 600;">Cancelar</button>
                <button type="submit" style="padding: 8px 16px; background: #173D2D; color: white; border: none; border-radius: 6px; cursor: pointer; font-weight: bold;">Guardar Usuario</button>
            </div>
        </form>
    </div>
</div>

<script src="/static/js/usuarios.js?v=2"></script>

{% endblock %}
